name: checks
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    # Allow time for the populated upgrade and its report after the PDF-heavy test suite.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: roots
          POSTGRES_PASSWORD: roots
          POSTGRES_DB: roots
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U roots" --health-interval 5s --health-retries 10
    env:
      DEBUG: "true"
      REQUIRE_WEASYPRINT: "1"
      DATABASE_URL: postgresql://roots:roots@127.0.0.1:5432/roots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Retry package downloads on transient mirror errors
        run: printf '%s\n' 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries
      - name: Install PDF libraries and PostgreSQL 17 backup tools
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - name: CHANGELOG.md matches changelog.d/
        run: uv run python manage.py changelog --check
      - run: uv run python manage.py migrate --noinput
      - name: Collect static assets for template-serving tests
        run: uv run python manage.py collectstatic --noinput
      - run: uv run pytest
      - name: Check out the installation to upgrade
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For promotion PRs and pushes to main, use main as it stood before promotion.
          ref: ${{ (github.ref == 'refs/heads/main' && github.event.before) || (github.base_ref == 'main' && github.event.pull_request.base.sha) || 'refs/heads/main' }}
          path: .upgrade-baseline
          persist-credentials: false
      - name: Create the synthetic baseline and empty restore databases
        run: |
          createdb --maintenance-db="$DATABASE_URL" roots_baseline
          createdb --maintenance-db="$DATABASE_URL" roots_upgrade
      - name: Capture the previous installation
        working-directory: .upgrade-baseline
        env:
          DATABASE_URL: postgresql://roots:roots@127.0.0.1:5432/roots_baseline
          DEMO_PASSWORD: disposable-ci-only-upgrade
          UPGRADE_EVIDENCE_PATH: ${{ runner.temp }}/upgrade-evidence.json
        run: |
          echo "Upgrade from $(git rev-parse HEAD) to $(git -C .. rev-parse HEAD)"
          evidence="$GITHUB_WORKSPACE/scripts/ci/upgrade_evidence.py"
          uv sync --frozen --no-dev
          .venv/bin/python manage.py migrate --noinput
          .venv/bin/python manage.py seed_demo --full
          UPGRADE_EVIDENCE_MODE=prepare .venv/bin/python manage.py shell --no-imports < "$evidence"
          UPGRADE_EVIDENCE_MODE=capture .venv/bin/python manage.py shell --no-imports < "$evidence"
      - name: Restore the PostgreSQL backup and verify it with the previous installation
        working-directory: .upgrade-baseline
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          DATABASE_URL: postgresql://roots:roots@127.0.0.1:5432/roots_upgrade
          UPGRADE_EVIDENCE_PATH: ${{ runner.temp }}/upgrade-evidence.json
          UPGRADE_VERIFIED_COUNTS_PATH: ${{ runner.temp }}/restored-counts.json
          UPGRADE_HISTORY_CHECKS_PATH: ${{ runner.temp }}/restored-history.json
        run: |
          # Use the service's matching PostgreSQL tools. Bash pipefail checks both commands.
          docker exec "$POSTGRES_CONTAINER" pg_dump -U roots --format=custom roots_baseline |
            docker exec -i "$POSTGRES_CONTAINER" pg_restore -U roots --dbname=roots_upgrade \
              --single-transaction --exit-on-error --no-owner --no-privileges
          UPGRADE_EVIDENCE_MODE=verify .venv/bin/python manage.py shell --no-imports < "$GITHUB_WORKSPACE/scripts/ci/upgrade_evidence.py"
      - name: Migrate the restored database and verify it with the candidate
        env:
          DATABASE_URL: postgresql://roots:roots@127.0.0.1:5432/roots_upgrade
          UPGRADE_EVIDENCE_PATH: ${{ runner.temp }}/upgrade-evidence.json
          UPGRADE_VERIFIED_COUNTS_PATH: ${{ runner.temp }}/upgrade-counts.json
          UPGRADE_HISTORY_CHECKS_PATH: ${{ runner.temp }}/upgraded-history.json
        run: |
          .venv/bin/python manage.py shell --no-imports < scripts/ci/upgrade_plan.py > "$RUNNER_TEMP/upgrade-plan.json"
          .venv/bin/python manage.py migrate --noinput
          .venv/bin/python manage.py migrate --check
          .venv/bin/python manage.py verify_stored_files --format json > "$RUNNER_TEMP/stored-file-counts.json"
          UPGRADE_EVIDENCE_MODE=verify .venv/bin/python manage.py shell --no-imports < scripts/ci/upgrade_evidence.py

      - name: Restore a paired backup and compare its file inventory
        env:
          DATABASE_URL: postgresql://roots:roots@127.0.0.1:5432/roots_upgrade
          PGHOST: 127.0.0.1
          PGUSER: roots
          PGPASSWORD: roots
        run: |
          backup_dir="$RUNNER_TEMP/paired-backup"
          .venv/bin/python manage.py backup_with_inventory --output "$backup_dir"
          createdb roots_paired_restore
          pg_restore --single-transaction --exit-on-error --no-owner --no-privileges \
            --dbname=roots_paired_restore "$backup_dir/database.dump"
          DATABASE_URL=postgresql://roots:roots@127.0.0.1:5432/roots_paired_restore \
            .venv/bin/python manage.py verify_stored_files --compare-manifest "$backup_dir/source-files.json"

      - name: Publish notes for the rehearsed upgrade
        run: |
          .venv/bin/python scripts/ci/upgrade_notes.py --baseline .upgrade-baseline --candidate . \
            --repository "$GITHUB_REPOSITORY" --plan "$RUNNER_TEMP/upgrade-plan.json" \
            --stored-file-counts "$RUNNER_TEMP/stored-file-counts.json" \
            --history-checks "$RUNNER_TEMP/restored-history.json" "$RUNNER_TEMP/upgraded-history.json" \
            --restored-counts "$RUNNER_TEMP/restored-counts.json" \
            --verified-counts "$RUNNER_TEMP/upgrade-counts.json" > "$RUNNER_TEMP/upgrade-notes.md"
          cat "$RUNNER_TEMP/upgrade-notes.md" >> "$GITHUB_STEP_SUMMARY"
          # Changelog text in the log is data, including any workflow-command syntax.
          marker=$(uuidgen)
          echo "::stop-commands::$marker"
          cat "$GITHUB_STEP_SUMMARY"
          echo "::$marker::"

      - name: Upload the rehearsed upgrade notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-rehearsal-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upgrade-notes.md
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: roots
          POSTGRES_PASSWORD: roots
          POSTGRES_DB: roots_browser
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U roots" --health-interval 5s --health-retries 10
    env:
      DEBUG: "true"
      REQUIRE_WEASYPRINT: "1"
      DATABASE_URL: postgresql://roots:roots@127.0.0.1:5432/roots_browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Retry package downloads on transient mirror errors
        run: printf '%s\n' 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries
      - name: Install PDF runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core poppler-utils
      - run: uv sync --frozen --group e2e
      - name: Install headless Chromium and system dependencies
        run: uv run --group e2e playwright install --with-deps --only-shell chromium
      - name: Collect assets with strict production manifest storage
        run: uv run --group e2e python manage.py collectstatic --noinput
      - name: Isolated browser journeys (one worker, disposable test database)
        run: uv run --group e2e pytest -c e2e/pytest.ini e2e

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: roots_ci
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: roots_container_smoke
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U roots_ci -d roots_container_smoke" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build application image (no push)
        run: docker build --tag environmental-lims:ci .
      - name: Validate the local trial Compose file
        run: docker compose --profile app config --quiet
      - name: Configure disposable smoke environment
        run: |
          cat > "$RUNNER_TEMP/roots-smoke.env" <<'ENV'
          DEBUG=false
          SECRET_KEY=disposable-ci-only-key-never-for-a-real-deployment-2026
          DATABASE_URL=postgresql://roots_ci:disposable_ci_password@127.0.0.1:5432/roots_container_smoke
          ALLOWED_HOSTS=127.0.0.1,localhost
          PORT=8000
          WEB_CONCURRENCY=1
          REPORT_SYNTHETIC_DATA_NOTICE=true
          ENV
      - name: Migrate empty smoke database and verify PDF/statistics runtime
        run: |
          docker run --rm --network host --env-file "$RUNNER_TEMP/roots-smoke.env" environmental-lims:ci python manage.py migrate --noinput
          docker run --rm --network host --env-file "$RUNNER_TEMP/roots-smoke.env" environmental-lims:ci python manage.py check
          docker run --rm --env-file "$RUNNER_TEMP/roots-smoke.env" environmental-lims:ci python -c 'from weasyprint import HTML; pdf=HTML(string="<h1>Synthetic container smoke</h1>").write_pdf(); assert pdf.startswith(b"%PDF-")'
          docker run --rm environmental-lims:ci python -c 'from scipy.stats import t; assert 3.142 < t.ppf(0.99, 6) < 3.144'
      - name: Run the acceptance scripts inside the image
        run: |
          install -d -m 0777 "$RUNNER_TEMP/acceptance"
          docker run --rm --network host --env-file "$RUNNER_TEMP/roots-smoke.env" \
            -v "$RUNNER_TEMP/acceptance:/evidence" environmental-lims:ci \
            python manage.py run_acceptance --operator "CI container smoke" --output /evidence/run
          (cd "$RUNNER_TEMP/acceptance/run" && sha256sum --check --quiet manifest-sha256.txt)
      - name: Verify non-root Render SSH prerequisites
        run: |
          docker run --rm environmental-lims:ci python -c 'import os, pwd, stat; from pathlib import Path; user=pwd.getpwuid(os.getuid()); home=Path.home(); ssh=home/".ssh"; assert os.getuid()==10001; assert str(home)==user.pw_dir=="/home/app" and os.access(home, os.W_OK); assert user.pw_shell=="/bin/bash" and os.access(user.pw_shell, os.X_OK); assert ssh.is_dir() and ssh.stat().st_uid==os.getuid(); assert stat.S_IMODE(ssh.stat().st_mode)==0o700; assert os.access(ssh, os.W_OK)'
      - name: Start production server and check HTTP endpoints
        run: |
          docker run --detach --name roots-smoke --network host --env-file "$RUNNER_TEMP/roots-smoke.env" environmental-lims:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/ready/; then break; fi
            sleep 2
          done
          curl --fail --show-error -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/health/
          curl --fail --show-error -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/ready/
          curl --fail --show-error -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/about/ --output /dev/null
          curl --fail --show-error -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/about/assets/site.css --output /dev/null
          curl --fail --show-error -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/accounts/login/ --output /dev/null
          curl --fail --show-error -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/static/admin/css/base.css --output /dev/null
      - name: Logs and cleanup
        if: always()
        run: |
          docker logs roots-smoke || true
          docker rm -f roots-smoke || true
          rm -f "$RUNNER_TEMP/roots-smoke.env"
